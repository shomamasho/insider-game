<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>インサイダーゲーム</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FAF8F5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            maru: ['"Zen Maru Gothic"', 'sans-serif'],
          },
          colors: {
            paper: '#FAF8F5',
            card: '#FFFFFF',
            ink: '#2B2D42',
            sub: '#6B7280',
            line: '#ECE8E1',
            pastel: {
              yellow: '#FFF3BF',
              yellowHover: '#FFE999',
              yellowBorder: '#F5DE87',
              orange: '#FFE7D1',
              orangeHover: '#FFD7B3',
              orangeBorder: '#F8C89A',
              warm: '#F5F0E8',
              active: '#EFE7DC'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FAF8F5;
      color: #2B2D42;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .card-shadow {
      box-shadow: 0 4px 16px -2px rgba(43, 45, 66, 0.05), 0 2px 6px -1px rgba(43, 45, 66, 0.03);
    }
    .btn-press:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

  <div id="app" class="w-full max-w-md mx-auto flex flex-col flex-1 justify-between py-2">
    <!-- Top Header -->
    <header class="flex items-center justify-between pb-3 border-b border-line">
      <div>
        <h1 class="text-lg font-bold tracking-wider text-ink">インサイダーゲーム</h1>
      </div>
      <div id="headerStatus" class="text-xs px-3 py-1 rounded-full bg-pastel-warm text-sub font-medium border border-line">
        設定
      </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main id="mainContainer" class="flex-1 flex flex-col justify-center my-4 overflow-y-auto hide-scrollbar">
      <!-- Dynamic Views Injected via JS -->
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-sub/70 pt-2 border-t border-line">
      <span>オフライン対応 / 完全無料</span>
    </footer>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(frequency = 520, duration = 0.12, type = 'sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn(e);
      }
    }

    function soundBeepSoft() { playTone(587.33, 0.1); }
    function soundNotice() {
      playTone(523.25, 0.1);
      setTimeout(() => playTone(659.25, 0.15), 100);
    }
    function soundTimeUp() {
      playTone(440, 0.16);
      setTimeout(() => playTone(349.23, 0.28), 160);
    }

    // 小学生でも知っている身近で一般的な自然な名詞のみを厳選
    const WORD_LIST = [
      // 家具・家電
      "冷蔵庫", "洗濯機", "テレビ", "ベッド", "机", "イス", "ソファ", "時計", "電子レンジ", "掃除機",
      "扇風機", "エアコン", "鏡", "こたつ", "本棚", "カーテン", "ゴミ箱", "ドライヤー", "電気スタンド", "タンス",
      "クッション", "絨毯", "まくら", "布団", "アイロン", "炊飯器", "オーブントースター", "電気ケトル", "姿見",

      // 動物・生き物
      "イヌ", "ネコ", "キリン", "ゾウ", "ライオン", "トラ", "パンダ", "コアラ", "ペンギン", "ウサギ",
      "ハムスター", "サル", "ゴリラ", "カンガルー", "シマウマ", "カメ", "カエル", "ワニ", "クジラ", "イルカ",
      "ラッコ", "アザラシ", "リス", "ブタ", "ウシ", "ウマ", "ヒツジ", "ヤギ", "ラクダ", "シカ",
      "カブトムシ", "クワガタムシ", "チョウ", "トンボ", "ホタル", "アリ", "ハチ", "セミ", "カタツムリ", "金魚",
      "サメ", "タコ", "イカ", "クラゲ", "カニ", "エビ",

      // 恐竜
      "ティラノサウルス", "トリケラトプス", "プテラノドン", "ブラキオサウルス", "ステゴサウルス",
      "スピノサウルス", "アンキロサウルス", "モササウルス", "化石",

      // コンビニ・食べ物・お菓子
      "おにぎり", "サンドイッチ", "お弁当", "カップラーメン", "アイスクリーム", "プリン", "ポテトチップス", "チョコレート", "ガム", "アメ",
      "食パン", "メロンパン", "カレーパン", "牛乳", "リンゴジュース", "オレンジジュース", "麦茶", "コーラ", "ココア",
      "カレーライス", "ラーメン", "お寿司", "ハンバーガー", "ピザ", "フライドポテト", "オムライス", "うどん", "そば", "たこ焼き",
      "焼きそば", "餃子", "唐揚げ", "ハンバーグ", "ホットケーキ", "クレープ", "ドーナツ", "ショートケーキ", "いちご", "バナナ",
      "リンゴ", "みかん", "ブドウ", "スイカ", "トマト", "きゅうり", "じゃがいも", "とうもろこし",

      // 職業
      "警察官", "消防士", "お医者さん", "看護師", "先生", "コック", "パイロット", "アイドル", "ユーチューバー", "宇宙飛行士",
      "サッカー選手", "野球選手", "花屋さん", "パン屋さん", "電車の運転士", "歌手", "漫画家", "ケーキ屋さん", "飼育員", "車掌",

      // 人・家族・身近な関係
      "お父さん", "お母さん", "お兄ちゃん", "お姉ちゃん", "弟", "妹", "おじいちゃん", "おばあちゃん", "赤ちゃん", "友達",
      "クラスメイト", "校長先生",

      // 乗り物・街にあるもの
      "パトカー", "救急車", "消防車", "バス", "タクシー", "自転車", "新幹線", "飛行機", "船", "ヘリコプター",
      "電柱", "信号機", "ポスト", "公園", "すべり台", "ブランコ", "砂場", "シーソー", "自動販売機", "横断歩道",
      "駅", "踏切", "トンネル", "橋", "学校", "病院", "交番", "消防署", "郵便局", "動物園",
      "水族館", "遊園地", "映画館", "図書館", "コンビニ", "スーパー", "ショッピングモール", "プール",

      // 文房具・日用品
      "鉛筆", "消しゴム", "定規", "ハサミ", "のり", "ノート", "筆箱", "ランドセル", "教科書", "色鉛筆",
      "セロハンテープ", "ホッチキス", "クリップ", "カバン", "傘", "歯ブラシ", "タオル", "石鹸", "シャンプー", "ティッシュ",
      "ハンカチ", "マスク", "絆創膏", "体温計", "靴", "靴下", "帽子", "水筒", "お弁当箱", "マグカップ",
      "箸", "スプーン", "フォーク", "お皿",

      // 自然・社会・誰でも知っている言葉
      "太陽", "月", "星", "雨", "雪", "虹", "雲", "雷", "海", "山",
      "川", "池", "島", "地球", "地球温暖化", "国境", "日本", "東京都", "富士山", "砂漠",
      "花火", "運動会", "遠足", "夏休み", "クリスマス", "お正月", "誕生日"
    ];

    const state = {
      players: ['プレイヤー1', 'プレイヤー2', 'プレイヤー3', 'プレイヤー4'],
      timeLimitMinutes: 5,
      currentWord: '',
      roles: {}, // playerName -> 'GM' | 'INSIDER' | 'COMMON'
      currentRevealIndex: 0,
      isCardOpen: false,
      guesser: '',
      timerSeconds: 300,
      timerRunning: false,
      timerId: null,
    };

    const container = document.getElementById('mainContainer');
    const headerStatus = document.getElementById('headerStatus');

    function setStatus(text) {
      headerStatus.innerText = text;
    }

    function renderSetup() {
      setStatus("設定");
      if (state.timerId) clearInterval(state.timerId);
      state.timerRunning = false;

      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-card border border-line rounded-2xl p-5 card-shadow space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-sm font-bold text-ink">参加プレイヤー (${state.players.length}人)</span>
              <span class="text-xs text-sub">4人 〜 10人</span>
            </div>
            
            <div class="space-y-2 max-h-52 overflow-y-auto pr-1">
              ${state.players.map((p, idx) => `
                <div class="flex items-center space-x-2">
                  <span class="text-xs text-sub/70 w-4">${idx + 1}</span>
                  <input type="text" value="${p}" onchange="updatePlayerName(${idx}, this.value)"
                    class="bg-pastel-warm/60 text-ink rounded-xl px-3 py-2 flex-1 text-sm border border-line focus:outline-none focus:bg-white" />
                  ${state.players.length > 4 ? `
                    <button onclick="removePlayer(${idx})" class="w-8 h-8 flex items-center justify-center text-sub hover:text-ink rounded-lg text-sm btn-press">✕</button>
                  ` : ''}
                </div>
              `).join('')}
            </div>

            ${state.players.length < 10 ? `
              <button onclick="addPlayer()" class="w-full py-2.5 rounded-xl border border-dashed border-line text-xs font-bold text-sub hover:bg-pastel-warm transition btn-press">
                ＋ プレイヤーを追加
              </button>
            ` : ''}
          </div>

          <div class="bg-card border border-line rounded-2xl p-5 card-shadow space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-sm font-bold text-ink">質問の制限時間</span>
              <select id="timeSelect" onchange="state.timeLimitMinutes = parseInt(this.value)"
                class="bg-pastel-warm/60 border border-line rounded-xl px-3 py-2 text-sm text-ink font-medium focus:outline-none focus:bg-white">
                <option value="3" ${state.timeLimitMinutes === 3 ? 'selected' : ''}>3分</option>
                <option value="4" ${state.timeLimitMinutes === 4 ? 'selected' : ''}>4分</option>
                <option value="5" ${state.timeLimitMinutes === 5 ? 'selected' : ''}>5分 (標準)</option>
                <option value="6" ${state.timeLimitMinutes === 6 ? 'selected' : ''}>6分</option>
                <option value="7" ${state.timeLimitMinutes === 7 ? 'selected' : ''}>7分</option>
              </select>
            </div>
            <div class="pt-2 border-t border-line flex justify-between text-xs text-sub">
              <span>収録単語</span>
              <span class="font-medium text-ink">${WORD_LIST.length} 語 (身近な言葉のみ)</span>
            </div>
          </div>

          <button onclick="startGame()" class="w-full bg-pastel-yellow hover:bg-pastel-yellowHover text-ink font-bold py-3.5 px-4 rounded-2xl border border-pastel-yellowBorder card-shadow transition btn-press text-base">
            ゲームを開始する
          </button>
        </div>
      `;
    }

    function addPlayer() {
      if (state.players.length < 10) {
        state.players.push(`プレイヤー${state.players.length + 1}`);
        renderSetup();
      }
    }
    function removePlayer(idx) {
      if (state.players.length > 4) {
        state.players.splice(idx, 1);
        renderSetup();
      }
    }
    function updatePlayerName(idx, val) {
      state.players[idx] = val.trim() || `プレイヤー${idx + 1}`;
    }

    function startGame() {
      state.currentWord = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)];

      const indices = [...Array(state.players.length).keys()].sort(() => Math.random() - 0.5);
      const gmIndex = indices[0];
      const insiderIndex = indices[1];

      state.roles = {};
      state.players.forEach((p, idx) => {
        if (idx === gmIndex) state.roles[p] = 'GM';
        else if (idx === insiderIndex) state.roles[p] = 'INSIDER';
        else state.roles[p] = 'COMMON';
      });

      state.currentRevealIndex = 0;
      state.isCardOpen = false;
      renderReveal();
    }

    function renderReveal() {
      const currentName = state.players[state.currentRevealIndex];
      const role = state.roles[currentName];
      setStatus(`役職確認 (${state.currentRevealIndex + 1}/${state.players.length})`);

      container.innerHTML = `
        <div class="space-y-4">
          <div class="text-center space-y-1">
            <span class="text-xs font-bold text-sub tracking-wider">プレイヤーの確認</span>
            <h2 class="text-xl font-bold text-ink">${currentName} さん</h2>
            <p class="text-xs text-sub">端末を受け取り、カードをタップしてください</p>
          </div>

          <!-- Tap-to-flip Role Card -->
          <div onclick="toggleCard()" class="cursor-pointer bg-card border border-line rounded-2xl p-6 min-h-[210px] flex flex-col justify-center items-center text-center card-shadow transition-all btn-press">
            ${!state.isCardOpen ? `
              <div class="space-y-2 py-4">
                <p class="text-base font-bold text-ink">タップして役職を確認</p>
                <p class="text-xs text-sub">周りの人に見られないよう注意してください</p>
              </div>
            ` : `
              <div class="space-y-3 py-2 w-full">
                <div class="inline-block px-3 py-1 rounded-full text-xs font-bold ${
                  role === 'GM' ? 'bg-pastel-yellow border border-pastel-yellowBorder text-ink' :
                  role === 'INSIDER' ? 'bg-pastel-orange border border-pastel-orangeBorder text-ink' :
                  'bg-pastel-warm border border-line text-ink'
                }">
                  ${role === 'GM' ? 'ゲームマスター' : role === 'INSIDER' ? 'インサイダー' : '庶民'}
                </div>

                ${(role === 'GM' || role === 'INSIDER') ? `
                  <div class="pt-2">
                    <span class="text-xs text-sub block">今回のお題</span>
                    <span class="text-2xl font-black text-ink block mt-1 tracking-wide">${state.currentWord}</span>
                  </div>
                ` : `
                  <div class="pt-2">
                    <p class="text-xs text-sub leading-relaxed">
                      お題は秘密です。<br>マスターにたくさん質問をしてお題を当てましょう。
                    </p>
                  </div>
                `}

                <p class="text-[11px] text-sub/70 pt-2 border-t border-line/60">もう一度タップすると伏せます</p>
              </div>
            `}
          </div>

          <button onclick="nextReveal()" class="w-full bg-pastel-warm hover:bg-pastel-active text-ink font-bold py-3.5 px-4 rounded-2xl border border-line card-shadow transition btn-press text-sm">
            ${state.currentRevealIndex + 1 < state.players.length ? '確認完了 (次の人へ渡す)' : '全員確認完了 (質問タイムへ)'}
          </button>
        </div>
      `;
    }

    function toggleCard() {
      state.isCardOpen = !state.isCardOpen;
      soundBeepSoft();
      renderReveal();
    }

    function nextReveal() {
      state.currentRevealIndex++;
      state.isCardOpen = false;
      if (state.currentRevealIndex < state.players.length) {
        renderReveal();
      } else {
        startQuestionPhase();
      }
    }

    function startQuestionPhase() {
      setStatus("質問中");
      state.timerSeconds = state.timeLimitMinutes * 60;
      state.timerRunning = true;
      renderQuestion();
      runTimer();
    }

    function renderQuestion() {
      setStatus("質問中");
      const mins = Math.floor(state.timerSeconds / 60);
      const secs = state.timerSeconds % 60;
      const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-card border border-line rounded-2xl p-6 card-shadow text-center space-y-4">
            <div class="space-y-1">
              <span class="text-xs font-bold text-sub tracking-wider">質問タイム</span>
              <h2 class="text-base font-bold text-ink">マスターにお題を質問してください</h2>
              <p class="text-xs text-sub">回答は「はい」「いいえ」「分かりません」のみ</p>
            </div>

            <div class="bg-pastel-warm/60 border border-line rounded-2xl py-6 flex flex-col items-center justify-center space-y-3">
              <span id="timerText" class="text-6xl font-bold tracking-tight text-ink font-mono">${timeStr}</span>
              <div class="flex space-x-2">
                <button onclick="toggleTimer()" class="px-4 py-1.5 rounded-xl bg-card border border-line text-xs font-bold text-ink hover:bg-white btn-press">
                  ${state.timerRunning ? '一時停止' : '再開'}
                </button>
                <button onclick="addMinute()" class="px-3 py-1.5 rounded-xl bg-card border border-line text-xs font-bold text-ink hover:bg-white btn-press">
                  +1分
                </button>
              </div>
            </div>

            <div class="space-y-2 pt-2">
              <button onclick="onWordGuessed()" class="w-full bg-pastel-yellow hover:bg-pastel-yellowHover text-ink font-bold py-3.5 rounded-2xl border border-pastel-yellowBorder card-shadow transition btn-press text-base">
                お題が正解された！
              </button>
              <button onclick="onTimeFail()" class="w-full bg-card hover:bg-pastel-warm text-sub font-semibold py-2.5 rounded-xl border border-line text-xs transition btn-press">
                時間切れ（正解できなかった）
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function runTimer() {
      if (state.timerId) clearInterval(state.timerId);
      state.timerId = setInterval(() => {
        if (!state.timerRunning) return;
        state.timerSeconds--;

        if (state.timerSeconds === 60 || state.timerSeconds === 30 || state.timerSeconds <= 5 && state.timerSeconds > 0) {
          soundBeepSoft();
        }

        if (state.timerSeconds <= 0) {
          clearInterval(state.timerId);
          state.timerSeconds = 0;
          soundTimeUp();
          onTimeFail();
          return;
        }

        const el = document.getElementById('timerText');
        if (el) {
          const m = Math.floor(state.timerSeconds / 60);
          const s = state.timerSeconds % 60;
          el.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
      }, 1000);
    }

    function toggleTimer() {
      state.timerRunning = !state.timerRunning;
      renderQuestion();
    }
    function addMinute() {
      state.timerSeconds += 60;
      renderQuestion();
    }

    function onTimeFail() {
      if (state.timerId) clearInterval(state.timerId);
      setStatus("時間切れ");
      soundTimeUp();

      container.innerHTML = `
        <div class="bg-card border border-line rounded-2xl p-6 card-shadow text-center space-y-4">
          <div class="space-y-1">
            <h2 class="text-xl font-bold text-ink">時間切れ</h2>
            <p class="text-xs text-sub">お題を当てることができませんでした<br>全員敗北となります</p>
          </div>

          <div class="bg-pastel-warm/60 border border-line p-4 rounded-xl text-left space-y-1">
            <span class="text-xs text-sub">正解のお題</span>
            <span class="text-base font-bold text-ink block">${state.currentWord}</span>
          </div>

          <button onclick="renderSetup()" class="w-full bg-pastel-yellow hover:bg-pastel-yellowHover text-ink font-bold py-3.5 rounded-2xl border border-pastel-yellowBorder card-shadow transition btn-press text-sm">
            もう一度遊ぶ
          </button>
        </div>
      `;
    }

    function onWordGuessed() {
      if (state.timerId) clearInterval(state.timerId);
      soundNotice();
      setStatus("正解者の記録");

      container.innerHTML = `
        <div class="bg-card border border-line rounded-2xl p-6 card-shadow space-y-4">
          <div class="text-center space-y-1">
            <span class="text-xs font-bold text-sub tracking-wider">正解者の記録</span>
            <h2 class="text-lg font-bold text-ink">誰がお題を当てましたか？</h2>
            <p class="text-xs text-sub">当てたプレイヤーを1人選択してください</p>
          </div>

          <div class="space-y-2 py-2">
            ${state.players.map(p => `
              <button onclick="confirmGuesser('${p}')" class="w-full text-left px-4 py-3 rounded-xl bg-pastel-warm/60 hover:bg-pastel-yellow/60 border border-line flex justify-between items-center transition btn-press">
                <span class="font-bold text-sm text-ink">${p}</span>
                <span class="text-xs text-sub font-medium">選択</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function confirmGuesser(player) {
      state.guesser = player;
      startGuesserVote();
    }

    function startGuesserVote() {
      setStatus("判定 1");

      container.innerHTML = `
        <div class="bg-card border border-line rounded-2xl p-6 card-shadow space-y-4">
          <div class="text-center space-y-1">
            <span class="text-xs font-bold text-sub tracking-wider">判定 1</span>
            <h2 class="text-lg font-bold text-ink">${state.guesser} さんは<br>インサイダーですか？</h2>
            <p class="text-xs text-sub leading-relaxed">
              会話で話し合い、せーので指差しなどで決定してください。<br>過半数の結果を選択します。
            </p>
          </div>

          <div class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="handleGuesserVote(true)" class="py-4 px-3 bg-pastel-orange hover:bg-pastel-orangeHover border border-pastel-orangeBorder rounded-xl text-center transition btn-press">
              <span class="font-bold text-sm text-ink block">インサイダーだ</span>
              <span class="text-[11px] text-sub block mt-1">過半数が疑っている</span>
            </button>
            <button onclick="handleGuesserVote(false)" class="py-4 px-3 bg-pastel-yellow hover:bg-pastel-yellowHover border border-pastel-yellowBorder rounded-xl text-center transition btn-press">
              <span class="font-bold text-sm text-ink block">インサイダーではない</span>
              <span class="text-[11px] text-sub block mt-1">無実（庶民）と判断</span>
            </button>
          </div>
        </div>
      `;
    }

    function handleGuesserVote(votedAsInsider) {
      if (votedAsInsider) {
        const wasInsider = (state.roles[state.guesser] === 'INSIDER');
        renderFinalResult({
          suspect: state.guesser,
          wasSuspectInsider: wasInsider,
          commonsWon: wasInsider,
          reason: wasInsider
            ? `お題を当てた ${state.guesser} さんはインサイダーでした。見破った庶民・マスターチームの勝利です。`
            : `お題を当てた ${state.guesser} さんは無実でした。インサイダーの勝利です。`
        });
      } else {
        startOtherVote();
      }
    }

    function startOtherVote() {
      setStatus("判定 2");
      const candidates = state.players.filter(p => p !== state.guesser);

      container.innerHTML = `
        <div class="bg-card border border-line rounded-2xl p-6 card-shadow space-y-4">
          <div class="text-center space-y-1">
            <span class="text-xs font-bold text-sub tracking-wider">判定 2</span>
            <h2 class="text-lg font-bold text-ink">インサイダーは誰ですか？</h2>
            <p class="text-xs text-sub leading-relaxed">
              話し合って最も怪しい人を指名してください。<br>※票数が同数になった場合は、お題を当てた人 (${state.guesser}) の指名が優先されます。
            </p>
          </div>

          <div class="space-y-2 py-2">
            ${candidates.map(c => `
              <button onclick="evaluateFinalSuspect('${c}')" class="w-full text-left px-4 py-3 rounded-xl bg-pastel-warm/60 hover:bg-pastel-orange/60 border border-line flex justify-between items-center transition btn-press">
                <span class="font-bold text-sm text-ink">${c}</span>
                <span class="text-xs text-sub font-medium">指名する</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function evaluateFinalSuspect(accusedPlayer) {
      const wasInsider = (state.roles[accusedPlayer] === 'INSIDER');
      renderFinalResult({
        suspect: accusedPlayer,
        wasSuspectInsider: wasInsider,
        commonsWon: wasInsider,
        reason: wasInsider
          ? `最多指名された ${accusedPlayer} さんがインサイダーでした。庶民・マスターチームの勝利です。`
          : `最多指名された ${accusedPlayer} さんはインサイダーではありませんでした。インサイダーの勝利です。`
      });
    }

    function renderFinalResult({ suspect, wasSuspectInsider, commonsWon, reason }) {
      setStatus("結果発表");
      if (commonsWon) soundNotice();
      else soundTimeUp();

      const insiderPlayer = Object.keys(state.roles).find(k => state.roles[k] === 'INSIDER');
      const gmPlayer = Object.keys(state.roles).find(k => state.roles[k] === 'GM');

      container.innerHTML = `
        <div class="bg-card border border-line rounded-2xl p-6 card-shadow space-y-4 text-center">
          <div class="space-y-1">
            <span class="text-xs font-bold uppercase tracking-wider text-sub">
              結果発表
            </span>
            <h2 class="text-2xl font-black text-ink">
              ${commonsWon ? '庶民 ＆ マスター の勝利' : 'インサイダー の勝利'}
            </h2>
            <p class="text-xs text-sub pt-1 leading-relaxed">${reason}</p>
          </div>

          <div class="bg-pastel-warm/60 border border-line rounded-xl p-4 text-left space-y-2.5 text-xs">
            <div class="flex justify-between items-center pb-1 border-b border-line/60">
              <span class="text-sub">正解のお題</span>
              <span class="font-bold text-sm text-ink">${state.currentWord}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-sub">インサイダー</span>
              <span class="font-bold text-ink">${insiderPlayer}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-sub">ゲームマスター</span>
              <span class="font-bold text-ink">${gmPlayer}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-sub">お題を当てた人</span>
              <span class="font-bold text-ink">${state.guesser || 'なし'}</span>
            </div>
          </div>

          <div class="pt-2 space-y-2">
            <button onclick="startGame()" class="w-full bg-pastel-yellow hover:bg-pastel-yellowHover text-ink font-bold py-3.5 rounded-2xl border border-pastel-yellowBorder card-shadow transition btn-press text-sm">
              同じメンバーで次のゲームへ
            </button>
            <button onclick="renderSetup()" class="w-full bg-pastel-warm hover:bg-pastel-active text-sub font-semibold py-2.5 rounded-xl border border-line text-xs transition btn-press">
              設定画面に戻る
            </button>
          </div>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderSetup();
    });
  </script>
</body>
</html>
